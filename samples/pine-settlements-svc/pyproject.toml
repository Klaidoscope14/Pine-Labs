[project]
name = "pine-settlements-svc"
version = "0.1.0"
description = "Sample merchant settlement service used as the AegisSDLC demo target."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]

[tool.coverage.run]
branch = true
source = ["app"]
