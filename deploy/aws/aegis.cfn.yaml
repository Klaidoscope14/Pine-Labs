AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AegisSDLC on one hardened EC2 instance (PLAN.md §10.4). No inbound access at all:
  shell and port forwarding go through Systems Manager. The region is whichever
  region the stack is deployed to (chosen by the operator, never hardcoded).

Parameters:
  InstanceType:
    Type: String
    Default: m7g.2xlarge
    AllowedValues: [m7g.xlarge, m7g.2xlarge, m7g.4xlarge]
    Description: Graviton instance. Resize by stop, change type, start; data lives on the EBS volume.
  VolumeGiB:
    Type: Number
    Default: 100
    MinValue: 50
    MaxValue: 500
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  VpcCidr:
    Type: String
    Default: 10.42.0.0/24
  CloudFrontPrefixListId:
    Type: String
    Default: ""
    Description: >
      Managed prefix list com.amazonaws.global.cloudfront.origin-facing for this region.
      Empty = no public endpoint (SSM tunnel only). scripts/aws.sh public fills it in.
  OriginSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Header value only CloudFront adds (X-Origin-Verify); the API refuses off-host requests without it.
  SecretsPrefix:
    Type: String
    Default: /aegis
    AllowedPattern: "^/[A-Za-z0-9_/-]+$"
    Description: SSM Parameter Store prefix holding the model API key (SecureString).

Conditions:
  PublicApi: !And
    - !Not [!Equals [!Ref CloudFrontPrefixListId, ""]]
    - !Not [!Equals [!Ref OriginSecret, ""]]

Resources:
  # ---------- network: one public subnet for outbound HTTPS; no inbound rules ----------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: aegis }]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway }
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref VpcCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: aegis }]
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: { RouteTableId: !Ref RouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway }
  SubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref Subnet, RouteTableId: !Ref RouteTable }
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AegisSDLC - no inbound; outbound HTTPS only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: "HTTPS for SSM, packages, images and the model API" }
      # No SecurityGroupIngress: nothing can connect in.

  # ---------- code bundle bucket (private, encrypted, short-lived objects) ----------
  BundleBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      LifecycleConfiguration:
        Rules: [{ Id: expire-bundles, Status: Enabled, ExpirationInDays: 7 }]
  BundleBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BundleBucket
      PolicyDocument:
        Statement:
          - Sid: TLSOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt BundleBucket.Arn, !Sub "${BundleBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  # ---------- least-privilege instance role (no access keys on the machine) ----------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { "aws:SourceAccount": !Ref "AWS::AccountId" } }
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: aegis-runtime
          PolicyDocument:
            Statement:
              - Sid: ReadCodeBundle
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${BundleBucket.Arn}/*"
              - Sid: ReadModelKey
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SecretsPrefix}/*
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref InstanceRole] }

  # ---------- the instance ----------
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 1, HttpEndpoint: enabled }
  Instance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref SecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: !Ref VolumeGiB, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Tags: [{ Key: Name, Value: aegis }]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          # First-boot provisioning. Versions are pinned; downloads are checksum-verified.
          set -euxo pipefail
          GO_VERSION=1.26.3
          dnf install -y docker git make python3 tar gzip openssl jq
          systemctl enable --now docker
          usermod -aG docker ec2-user
          # Docker Compose v2 plugin
          mkdir -p /usr/local/lib/docker/cli-plugins
          COMPOSE_VERSION=v2.40.3
          curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-compose \
            "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-aarch64"
          curl -fsSL -o /tmp/compose.sha256 \
            "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-aarch64.sha256"
          (cd /usr/local/lib/docker/cli-plugins && awk '{print $1"  docker-compose"}' /tmp/compose.sha256 | sha256sum -c -)
          chmod 755 /usr/local/lib/docker/cli-plugins/docker-compose
          # Docker buildx (needed for BuildKit bind-mount builds)
          BUILDX_VERSION=v0.29.1
          curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-buildx \
            "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-arm64"
          curl -fsSL -o /tmp/buildx.checksums "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/checksums.txt"
          (cd /usr/local/lib/docker/cli-plugins && grep "buildx-${BUILDX_VERSION}.linux-arm64$" /tmp/buildx.checksums | awk '{print $1"  docker-buildx"}' | sha256sum -c -)
          chmod 755 /usr/local/lib/docker/cli-plugins/docker-buildx
          # Go toolchain (official tarball, checksum from go.dev)
          curl -fsSL -o /tmp/go.tgz "https://go.dev/dl/go${GO_VERSION}.linux-arm64.tar.gz"
          GO_SHA=$(curl -fsSL "https://go.dev/dl/?mode=json&include=all" | jq -r --arg f "go${GO_VERSION}.linux-arm64.tar.gz" '.[].files[] | select(.filename==$f) | .sha256')
          echo "${GO_SHA}  /tmp/go.tgz" | sha256sum -c -
          rm -rf /usr/local/go && tar -C /usr/local -xzf /tmp/go.tgz
          echo 'export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH' > /etc/profile.d/go.sh
          # gVisor (runsc) as an extra Docker runtime for sandboxes (pinned release, sha512-verified)
          GVISOR_RELEASE=20261116
          URL=https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/aarch64
          dnf install -y bzip2
          curl -fsSL -o /tmp/gvisor.tar.bz2 "${URL}/gvisor.tar.bz2"
          curl -fsSL -o /tmp/gvisor.tar.bz2.sha512 "${URL}/gvisor.tar.bz2.sha512"
          (cd /tmp && echo "$(awk '{print $1}' gvisor.tar.bz2.sha512)  gvisor.tar.bz2" | sha512sum -c -)
          mkdir -p /tmp/gvisor && tar -xjf /tmp/gvisor.tar.bz2 -C /tmp/gvisor
          install -m 755 /tmp/gvisor/runsc /tmp/gvisor/containerd-shim-runsc-v1 /usr/local/bin/
          # Helper binaries from the same verified tarball (runsc would otherwise fetch them itself).
          rm -rf /usr/local/bin/gvisor-bin && cp -r /tmp/gvisor/gvisor-bin /usr/local/bin/gvisor-bin
          /usr/local/bin/runsc install
          systemctl restart docker
          # Application directory owned by ec2-user; private to that user.
          install -d -o ec2-user -g ec2-user -m 750 /opt/aegis
          touch /opt/aegis/.provisioned

  # ---------- optional public API for the Vercel frontend: CloudFront only ----------
  ApiAddress:
    Type: AWS::EC2::EIP
    Condition: PublicApi
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags: [{ Key: Name, Value: aegis-api }]
  ApiFromCloudFront:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: PublicApi
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: 8480
      ToPort: 8480
      SourcePrefixListId: !Ref CloudFrontPrefixListId
      Description: Aegis API, reachable only from CloudFront origin-facing addresses
  ApiDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: PublicApi
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Aegis API for the Vercel frontend (no caching)
        PriceClass: PriceClass_200
        HttpVersion: http2and3
        Origins:
          - Id: aegis-api
            # Public DNS of the Elastic IP (stable across instance stop/start).
            DomainName: !Join ["", ["ec2-", !Join ["-", !Split [".", !Ref ApiAddress]], ".", !Ref "AWS::Region", ".compute.amazonaws.com"]]
            CustomOriginConfig:
              HTTPPort: 8480
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginSecret
        DefaultCacheBehavior:
          TargetOriginId: aegis-api
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader

Outputs:
  InstanceId:
    Value: !Ref Instance
  BundleBucket:
    Value: !Ref BundleBucket
  Region:
    Value: !Ref AWS::Region
  ApiUrl:
    Condition: PublicApi
    Description: Set this as AEGIS_API_URL in Vercel
    Value: !Sub "https://${ApiDistribution.DomainName}"
