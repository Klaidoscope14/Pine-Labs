# AegisSDLC local stack.
# Versions: versions.env. Secrets: .env.secrets (generated by `make secrets`, never committed).
# Every port binds to 127.0.0.1 only.
name: aegis

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  postgres:
    <<: *hardening
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make secrets}
      POSTGRES_DB: aegis
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    <<: *hardening
    image: ${TEMPORAL_IMAGE}
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: aegis
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
    ports: ["127.0.0.1:7233:7233"]
    healthcheck:
      test: ["CMD-SHELL", "tctl --address $$(hostname -i):7233 cluster health | grep -q SERVING"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  temporal-ui:
    <<: *hardening
    image: ${TEMPORAL_UI_IMAGE}
    depends_on: { temporal: { condition: service_healthy } }
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["127.0.0.1:8233:8080"]

  nats:
    <<: *hardening
    image: ${NATS_IMAGE}
    command: ["-js", "-sd", "/data", "-m", "8222", "--user", "aegis", "--pass", "${NATS_PASSWORD:?run make secrets}"]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    volumes: [nats-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    <<: *hardening
    image: ${SEAWEEDFS_IMAGE}
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - seaweed-data:/data
      - ./.s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  otel-collector:
    <<: *hardening
    image: ${OTEL_COLLECTOR_IMAGE}
    command: ["--config=/etc/otel/config.yaml"]
    volumes: [./otel-collector.yaml:/etc/otel/config.yaml:ro]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318", "127.0.0.1:13133:13133"]
    depends_on: [jaeger]

  jaeger:
    <<: *hardening
    image: ${JAEGER_IMAGE}
    ports: ["127.0.0.1:16686:16686"]

  prometheus:
    <<: *hardening
    image: ${PROMETHEUS_IMAGE}
    command: ["--config.file=/etc/prometheus/prometheus.yaml"]
    volumes: [./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro]
    ports: ["127.0.0.1:9090:9090"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    <<: *hardening
    image: ${GRAFANA_IMAGE}
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run make secrets}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes: [./grafana/datasources:/etc/grafana/provisioning/datasources:ro]
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 30

  smokescreen:
    <<: *hardening
    build:
      context: .
      dockerfile: smokescreen.Dockerfile
      args:
        GO_IMAGE: ${GO_IMAGE}
        SMOKESCREEN_VERSION: ${SMOKESCREEN_VERSION}
    image: aegis-smokescreen:${SMOKESCREEN_VERSION}
    command:
      - --listen-ip=0.0.0.0
      - --egress-acl-file=/etc/smokescreen/acl.yaml
      - --expose-prometheus-metrics
      - --prometheus-listen-ip=0.0.0.0
    volumes: [./smokescreen-acl.yaml:/etc/smokescreen/acl.yaml:ro]
    ports: ["127.0.0.1:4750:4750"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9810/metrics >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  nats-data:
  seaweed-data:
