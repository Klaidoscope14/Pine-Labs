# Local development config. No secrets: every credential is an env:/vault: reference.
# "local-*" regions stand in for the operator-chosen Indian regions in real deployments.
version: 1

deployment:
  environment: local
  primary_region: local-primary
  dr_region: local-dr

data_residency:
  allowed_jurisdictions: [IN]
  exceptions:
    # Model benchmark only: DeepSeek via deploy.com is hosted outside India.
    # Synthetic sample repo only; the prompt data filter still runs. Refused in production.
    - endpoint: llm-deploy-sf
      reason: Benchmark DeepSeek V4.1 Flash against Claude Opus 5 on synthetic data
      expires: "2026-12-31"
      environments: [local]

endpoints:
  - { name: postgres-admin, kind: database,     url: "postgres://aegis@127.0.0.1:5432/aegis", jurisdiction: IN, credentials_ref: env:POSTGRES_PASSWORD }
  - { name: postgres,     kind: database,       url: "postgres://aegis_app@127.0.0.1:5432/aegis", jurisdiction: IN, credentials_ref: env:AEGIS_APP_DB_PASSWORD }
  - { name: temporal,     kind: workflow,       url: "127.0.0.1:7233",        jurisdiction: IN }
  - { name: nats,         kind: events,         url: "nats://127.0.0.1:4222" }
  - { name: artifacts,    kind: object_storage, url: "http://127.0.0.1:8333", jurisdiction: IN, credentials_ref: env:AEGIS_S3_CREDENTIALS }
  - { name: backups,      kind: backup,         url: "file://./.data/backups" }
  - { name: otel,         kind: telemetry,      url: "127.0.0.1:4317",        jurisdiction: IN }
  - { name: egress-proxy, kind: egress_proxy,   url: "127.0.0.1:4750",        jurisdiction: IN }
  - { name: code-host,    kind: code_host,      url: "file://./.data/git",    jurisdiction: IN }
  - { name: llm-bedrock-india, kind: llm,        url: "https://bedrock-runtime.ap-south-1.amazonaws.com", jurisdiction: IN }
  - { name: llm-deploy-sf,  kind: llm,        url: "https://api-sf1-cdn.deploy.com/api/v1", jurisdiction: US }
  - { name: llm-fake,     kind: llm,            url: "file://./evals/cassettes" }

llm:
  providers:
    - name: replay
      kind: replay
      endpoint: llm-fake
      api_key_ref: env:AEGIS_LLM_FAKE_KEY
      cassette_dir: evals/cassettes
      models: { analyst: recorded, architect: recorded, developer: recorded, release: recorded }
    # Claude on Amazon Bedrock through the India geographic inference profile
    # (routes only between the two India regions). Used when listed in fallback_order.
    - name: bedrock-india
      kind: bedrock
      endpoint: llm-bedrock-india
      api_key_ref: env:AWS_PROFILE
      # The AWS profile (in ~/.aws/config) whose account pays for Bedrock. Set it to the
      # account you choose; "default" is refused so the wrong account is never used by accident.
      aws_profile: aegis-bedrock
      region: ap-south-1
      verify_profile_routing: true
      allowed_regions: [ap-south-1, ap-south-2]
      price_table_ref: prices/bedrock-india.yaml
      record: true                 # keep responses for offline replay (refused in production)
      cassette_dir: evals/cassettes/recorded/bedrock-india
      models:
        analyst: in.anthropic.claude-opus-5
        architect: in.anthropic.claude-opus-5
        developer: in.anthropic.claude-opus-5
        release: in.anthropic.claude-opus-5
    # DeepSeek V4.1 Flash via deploy.com (OpenAI-compatible API). Benchmark use only.
    - name: deepseek
      kind: openai_compat
      endpoint: llm-deploy-sf
      api_key_ref: env:DEPLOY_API_KEY
      price_table_ref: prices/deploy-com.yaml
      record: true
      cassette_dir: evals/cassettes/recorded/deepseek
      models:
        analyst: deepseek-ai/deepseek-v4.1-flash-1017
        architect: deepseek-ai/deepseek-v4.1-flash-1017
        developer: deepseek-ai/deepseek-v4.1-flash-1017
        release: deepseek-ai/deepseek-v4.1-flash-1017
  fallback_order: [replay]
  max_retries: 2
  roles:
    analyst:   { effort: low,  max_tokens: 16000 }
    architect: { effort: high, max_tokens: 16000 }
    developer: { effort: high, max_tokens: 16000 }
    release:   { effort: low,  max_tokens: 8000 }

workflow: { max_ci_rounds: 2, max_schema_repairs: 2, max_arbitration_rounds: 1 }
budget: { per_run_tokens: 2000000, per_run_usd: 5, per_tenant_daily_usd: 100 }
review:
  wip_per_reviewer: 2
  required_approvers: { low: 1, high: 2, protected: 2 }
scope:
  protected_paths: ["app/config/payout_auth.py", ".agent-rules.md", ".github/**", "protected_paths.yaml"]
  diff_budget: { files: 8, lines: 400 }
  lease_ttl_seconds: 1800
sandbox:
  image: aegis-sandbox:dev
  cpus: 1
  memory_mb: 1024
  pids: 256
  timeout_seconds: 600
  warm_pool_size: 2
  network: none
  max_output_bytes: 4194304
  max_concurrent: 4
  host_reserve_mb: 4096
tenants:
  - { id: payments-team,    concurrency: 4, queue_priority: high,   daily_usd: 50 }
  - { id: settlements-team, concurrency: 4, queue_priority: normal, daily_usd: 50 }
tokens: { capability_ttl_seconds: 900 }
approval: { expiry_seconds: 86400 }
api: { listen: "127.0.0.1:8480" }
gates:
  enabled: [scope, integrity, lint, tests, hidden_tests, semgrep, bandit, secrets, dependencies, openapi, replay]
  tier1: [scope, integrity, lint, tests]
  security: [semgrep, bandit, secrets, dependencies]
  tier2: [hidden_tests, openapi, replay]
  parallelism: 3
  semgrep_rules_dir: rules/semgrep
  rules_ref: fin-rules-v0
workspace:
  mirrors_dir: .data/mirrors
  runs_dir: .data/runs
  artifacts_dir: .data/artifacts
  commit_author_name: aegis-agent
  commit_author_email: aegis-agent@aegis.invalid
temporal: { endpoint: temporal, namespace: default, task_queue: aegis-runs, max_concurrent_activities: 16, heartbeat_seconds: 20 }
ledger:
  admin_endpoint: postgres-admin
  app_endpoint: postgres
  app_role: aegis_app
  app_password_ref: env:AEGIS_APP_DB_PASSWORD
repos:
  - name: pine-settlements-svc
    endpoint: code-host
    path: pine-settlements-svc.git
    default_branch: main
    source_dirs: [app]
    dependency_files: [requirements.txt, requirements-dev.txt, requirements.lock, pyproject.toml]
    openapi_export: [python, scripts/export_openapi.py]
evals:
  hidden_tests_dir: evals/hidden/pine-settlements-svc
  replay_dir: evals/replay/pine-settlements-svc
  scenarios_dir: evals/scenarios
agents:
  mode: stub
  max_tool_calls: 40
  max_read_bytes: 65536
  max_run_tests: 4
  max_context_bytes: 200000
  prompts_dir: prompts
  import_graph_script: tools/importgraph.py
slo: {}
load: { concurrent_runs: 50 }
policy: { bundle_ref: approvals-v0 }
