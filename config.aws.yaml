# AegisSDLC on the AWS instance (PLAN.md §10.4): DeepSeek agents, gVisor sandboxes,
# limits sized for m7g.2xlarge (8 vCPU / 32 GB). The worker refuses to start if
# max_concurrent × memory_mb + host_reserve_mb does not fit the host's memory.
extends: config.deepseek.yaml
# "staging", not "production": DeepSeek via deploy.com is outside India and allowed
# only by a residency exception, which the config guard refuses in production.
# Production needs an India-hosted model endpoint (PLAN.md §10.5 L18 or Bedrock India).
deployment:
  environment: staging
  primary_region: ap-south-1
  dr_region: ap-south-2
sandbox:
  runtime: runsc
  max_concurrent: 16
  host_reserve_mb: 6144
gates:
  parallelism: 6
llm:
  roles:
    # Adaptive effort (PLAN.md §10.5 L10): planning turns and turns after a failure stay
    # at `high`; routine reads and edits use `low`. Kept only if the benchmark holds.
    developer: { effort: high, routine_effort: low, max_tokens: 16000 }
# The Vercel frontend reaches the API through CloudFront only: the security group
# admits CloudFront's origin-facing addresses on 8480, and the API refuses any
# off-host request without CloudFront's secret header. Loopback (SSM tunnel) still works.
api:
  listen: "0.0.0.0:8480"
  origin_secret_ref: env:AEGIS_ORIGIN_SECRET
